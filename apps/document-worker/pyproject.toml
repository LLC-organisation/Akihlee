[project]
name = "akihlee-document-worker"
version = "0.1.0"
description = "Document OCR and extraction worker for Akihlee"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # Queue/messaging
    "aio-pika>=9.4.0",  # RabbitMQ async client

    # OCR and document processing
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.4.0",

    # AWS SDK for S3/Textract (optional)
    "boto3>=1.34.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # HTTP client
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
