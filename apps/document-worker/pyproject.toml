[project]
name = "akihlee-document-worker"
version = "0.1.0"
description = "Document OCR and extraction worker for Akihlee"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # Queue/messaging

    # OCR and document processing
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.4.0",
    "pymupdf>=1.24.0",

    # PII redaction (see app/services/pii_redactor.py) — presidio-analyzer
    # alone is enough here since redaction itself is hand-rolled via
    # PyMuPDF; presidio-anonymizer's string-anonymization isn't used.
    "presidio-analyzer>=2.2.354",
    "spacy>=3.7.0",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",

    # AWS SDK for S3 and Bedrock (Converse API requires boto3>=1.34.116)
    "boto3>=1.34.130",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",

    # HTTP client
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
