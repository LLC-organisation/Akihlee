substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_PROJECT_ID: hallowed-index-504918-b4
  _AR_REPOSITORY: cloud-run-source-deploy
  REPO_NAME: llc-organisation-akihlee
  _SERVICE_NAME: document-worker
  _DEPLOY_REGION: europe-west1

  # Plain (non-secret) runtime config — set these as substitution
  # variables on the Cloud Build trigger (Console: trigger > Edit >
  # Substitution variables, or `gcloud builds triggers update
  # --substitutions=...`). Defaults below are dev-safe fallbacks only.
  _CORE_API_URL: https://akihlee-api-302086001342.europe-west1.run.app
  _DATABASE_URL: ''
  _S3_ENDPOINT: ''
  _S3_BUCKET_DOCUMENTS: ''
  _AWS_REGION: 'us-east-1'
  _BEDROCK_MODEL_ID: 'us.anthropic.claude-sonnet-4-5-20250929-v1:0'
  _VISION_EXTRACTION_ENABLED: 'true'
  _VISION_EXTRACTION_TIMEOUT_SECONDS: '150'
  _OCR_CONFIDENCE_THRESHOLD: '0.7'
  _MAX_PDF_PAGES: '5'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

steps:
  - id: Pull
    name: gcr.io/cloud-builders/docker
    entrypoint: /bin/bash
    args:
      - -c
      - docker pull $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest || exit 0

  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest
      - apps/document-worker
      - -f
      - apps/document-worker/Dockerfile

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME

  # document-worker is now a plain request-driven HTTP service: Pub/Sub
  # pushes one HTTP request per document event to /internal/pubsub/..., so
  # Cloud Run's default (CPU throttled between requests, scale-to-zero) is
  # correct here — no --no-cpu-throttling/--min-instances needed anymore.
  # --concurrency=1 keeps OCR/vision extraction (CPU/memory-heavy per
  # document) from contending for the single shared vCPU; --max-instances=2
  # caps cost during a backlog. Auth is IAM-only (no --allow-unauthenticated)
  # since only the Pub/Sub push subscription's service account should be
  # able to call this endpoint.
  #
  # --set-env-vars / --set-secrets fully REPLACE the revision's env config
  # each deploy (not merge) — every variable the app needs has to be listed
  # here every time, same reasoning as core-api's cloudbuild.yaml.
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --no-allow-unauthenticated
      # min-instances/cpu-throttling are "sticky" revision-template settings
      # that persist across deploys if simply omitted (unlike --set-env-vars/
      # --set-secrets, which do fully replace) — they must be explicitly
      # reset here or the previous always-on config silently survives.
      - --min-instances=0
      - --cpu-throttling
      - --concurrency=1
      - --max-instances=2
      - --cpu-boost
      - --memory=1Gi
      - --cpu=1
      - --update-labels=managed-by=gcp-cloud-build-deploy-cloud-run,gcb-trigger-id=$_TRIGGER_ID,gcb-trigger-region=$LOCATION,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --set-env-vars=CORE_API_URL=$_CORE_API_URL,DATABASE_URL=$_DATABASE_URL,S3_ENDPOINT=$_S3_ENDPOINT,S3_BUCKET_DOCUMENTS=$_S3_BUCKET_DOCUMENTS,AWS_REGION=$_AWS_REGION,BEDROCK_MODEL_ID=$_BEDROCK_MODEL_ID,VISION_EXTRACTION_ENABLED=$_VISION_EXTRACTION_ENABLED,VISION_EXTRACTION_TIMEOUT_SECONDS=$_VISION_EXTRACTION_TIMEOUT_SECONDS,OCR_CONFIDENCE_THRESHOLD=$_OCR_CONFIDENCE_THRESHOLD,MAX_PDF_PAGES=$_MAX_PDF_PAGES
      - --set-secrets=S3_SECRET_KEY=S3_SECRET_KEY:latest,S3_ACCESS_KEY=S3_ACCESS_KEY:latest,INTERNAL_API_KEY=INTERNAL_API_KEY:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest
      - --quiet

images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME
