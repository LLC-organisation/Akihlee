server.port=${PORT:8090}

# Public identifier — safe to keep in source/config, unlike the secret below.
quickbooks.client-id=${QUICKBOOKS_CLIENT_ID:ABKan1gQWLhkqBXf7vP1e7jRfbUb97j8ZFD2SYIXDFP1ofihXQ}

# NEVER hardcode this. Copy it from your app's Keys & OAuth page on
# developer.intuit.com and export it as an environment variable before
# starting the app (see README.md). Left blank here on purpose so a
# missing env var fails loudly (IntuitOAuthClient checks isConfigured())
# instead of silently sending an empty secret to Intuit.
quickbooks.client-secret=${QUICKBOOKS_CLIENT_SECRET:}

# This is Intuit's own hosted OAuth Playground / Quickstart redirect page,
# not a page this app serves — see README.md "Why redirect_uri points at
# developer.intuit.com" for what that means for the flow below.
quickbooks.redirect-uri=${QUICKBOOKS_REDIRECT_URI:https://developer.intuit.com/app/developer/quickstart}

quickbooks.scopes=${QUICKBOOKS_SCOPES:com.intuit.quickbooks.accounting openid profile email phone address}

# sandbox | production — only the Accounting/OpenID API hosts change
# between the two; the OAuth authorize/token/revoke endpoints are the same
# in both environments.
quickbooks.environment=${QUICKBOOKS_ENVIRONMENT:sandbox}

# Where tokens are persisted between runs (see oauth/TokenStore.java) —
# gitignored, never commit this file once it exists.
quickbooks.token-store-path=${QUICKBOOKS_TOKEN_STORE_PATH:./tokens.local.json}
