spring:
  application:
    name: akihlee-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

server:
  port: ${SERVER_PORT:8080}

s3:
  endpoint: ${S3_ENDPOINT}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket:
    documents: ${S3_BUCKET_DOCUMENTS}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

worker:
  api-key: ${INTERNAL_API_KEY}

# Optional until a real WhatsApp Business Account is configured — defaults
# let the app boot and the webhook verify-handshake respond even with no
# real credentials; actual message/media calls will just fail (logged).
whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:dev_verify_token_change_me}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
