spring:
  application:
    name: akihlee-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # HikariCP defaults to 10, but Supabase's session pooler (Supavisor)
      # caps free-tier projects at pool_size: 15 total, shared across every
      # connected instance — local dev, Render, a mid-deploy old+new pair,
      # etc. Keep this conservative so one instance can't eat the whole
      # budget and starve the others out with EMAXCONNSESSION.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase pre-applies its own default schema grants (to anon/
    # authenticated/service_role) on `public` for every new project, which
    # makes Flyway see the schema as "non-empty" even with zero tables in
    # it. Baselining is safe here specifically because there are no actual
    # tables to conflict with. baseline-version must be 0 (below V1), not
    # Flyway's default of 1 — 1 would mark V1 itself as already applied and
    # skip straight to V2, which then fails referencing tables V1 was
    # supposed to have created.
    baseline-on-migrate: true
    baseline-version: "0"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # CloudAMQP (and most managed RabbitMQ) serve AMQPS on port 5671, which
    # is TLS-only — Spring doesn't infer this from the port number, so it
    # must be enabled explicitly or the connection just hangs/fails.
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

server:
  # Render (and similar PaaS hosts) inject PORT and expect the app to bind
  # to it; SERVER_PORT still wins if you set it explicitly (e.g. locally).
  port: ${SERVER_PORT:${PORT:8080}}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

s3:
  endpoint: ${S3_ENDPOINT}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket:
    documents: ${S3_BUCKET_DOCUMENTS}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

worker:
  api-key: ${INTERNAL_API_KEY}

# Optional until a real WhatsApp Business Account is configured — defaults
# let the app boot and the webhook verify-handshake respond even with no
# real credentials; actual message/media calls will just fail (logged).
whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:dev_verify_token_change_me}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}

# Optional until a real inbound-email provider (e.g. SendGrid Inbound
# Parse) is configured with MX records for this domain — defaults let the
# app boot and the webhook respond even with no real setup yet.
email:
  inbound-domain: ${EMAIL_INBOUND_DOMAIN:receipts.akihlee.com}
  webhook-secret: ${EMAIL_WEBHOOK_SECRET:dev_email_webhook_secret_change_me}
