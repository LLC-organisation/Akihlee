spring:
  application:
    name: akihlee-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # HikariCP defaults to 10, but Supabase's session pooler (Supavisor)
      # caps free-tier projects at pool_size: 15 total, shared across every
      # connected instance — local dev, Render, a mid-deploy old+new pair,
      # etc. Keep this conservative so one instance can't eat the whole
      # budget and starve the others out with EMAXCONNSESSION.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase pre-applies its own default schema grants (to anon/
    # authenticated/service_role) on `public` for every new project, which
    # makes Flyway see the schema as "non-empty" even with zero tables in
    # it. Baselining is safe here specifically because there are no actual
    # tables to conflict with. baseline-version must be 0 (below V1), not
    # Flyway's default of 1 — 1 would mark V1 itself as already applied and
    # skip straight to V2, which then fails referencing tables V1 was
    # supposed to have created.
    baseline-on-migrate: true
    baseline-version: "0"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # CloudAMQP (and most managed RabbitMQ) serve AMQPS on port 5671, which
    # is TLS-only — Spring doesn't infer this from the port number, so it
    # must be enabled explicitly or the connection just hangs/fails.
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

server:
  # Render (and similar PaaS hosts) inject PORT and expect the app to bind
  # to it; SERVER_PORT still wins if you set it explicitly (e.g. locally).
  port: ${SERVER_PORT:${PORT:8080}}
  # Behind Render's proxy, Spring otherwise sees an internal http://
  # request; this makes HttpServletRequest reflect the real https:// URL
  # Twilio called, which its webhook signature is computed against.
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

s3:
  endpoint: ${S3_ENDPOINT}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket:
    documents: ${S3_BUCKET_DOCUMENTS}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

worker:
  api-key: ${INTERNAL_API_KEY}

# Optional until a real Twilio WhatsApp sender is configured — defaults let
# the app boot with no real credentials; actual message/media calls will
# just fail (logged). webhook-validation-enabled should stay true in any
# environment Twilio can actually reach; only disable for local testing
# with curl, where there's no real X-Twilio-Signature to check.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}
  webhook-validation-enabled: ${TWILIO_WEBHOOK_VALIDATION_ENABLED:true}

# Optional until a real inbound-email provider (e.g. SendGrid Inbound
# Parse) is configured with MX records for this domain — defaults let the
# app boot and the webhook respond even with no real setup yet.
email:
  inbound-domain: ${EMAIL_INBOUND_DOMAIN:receipts.akihlee.com}
  webhook-secret: ${EMAIL_WEBHOOK_SECRET:dev_email_webhook_secret_change_me}

# Optional until a Square access token is configured — defaults let the app
# boot with no real credentials; sync requests will fail cleanly (see
# SquareIntegrationController) rather than crashing the app at startup.
# access-token is the operator's own fallback token (used for any tenant
# that hasn't connected their own Square account via OAuth below);
# oauth.* lets individual tenants self-serve a "Connect with Square"
# button instead of needing an env var at all.
bedrock:
  region: ${AWS_REGION:us-east-1}
  model-id: ${BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-4-5-20250929-v1:0}
  # Optional until provisioned — blank means AiCfoService.callBedrock skips
  # attaching guardrailConfig entirely (same "unconfigured = skip" pattern
  # as Square/Twilio/Email below). Not a secret — just an identifier.
  guardrail-id: ${BEDROCK_GUARDRAIL_ID:}
  guardrail-version: ${BEDROCK_GUARDRAIL_VERSION:}

square:
  access-token: ${SQUARE_ACCESS_TOKEN:}
  environment: ${SQUARE_ENVIRONMENT:sandbox}
  oauth:
    client-id: ${SQUARE_OAUTH_CLIENT_ID:}
    client-secret: ${SQUARE_OAUTH_CLIENT_SECRET:}
    # Must exactly match a Redirect URL registered on the Square
    # application (developer.squareup.com) or obtainToken will reject it.
    redirect-uri: ${SQUARE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/integrations/square/oauth/callback}

# No shared access-token fallback here, unlike square: above — QuickBooks
# is OAuth-only, every tenant must connect their own company.
quickbooks:
  environment: ${QUICKBOOKS_ENVIRONMENT:sandbox}
  oauth:
    client-id: ${QUICKBOOKS_OAUTH_CLIENT_ID:}
    client-secret: ${QUICKBOOKS_OAUTH_CLIENT_SECRET:}
    # Must exactly match a Redirect URI registered on the app (Sandbox or
    # Production, matching QUICKBOOKS_ENVIRONMENT) at developer.intuit.com,
    # or the token exchange will reject it.
    redirect-uri: ${QUICKBOOKS_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/integrations/quickbooks/oauth/callback}

# Where to send the browser back to after the Square/QuickBooks OAuth
# callback finishes — the frontend origin, not this API's own.
app:
  web-url: ${APP_WEB_URL:http://localhost:3000}
