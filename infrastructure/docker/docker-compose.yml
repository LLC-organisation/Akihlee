version: '3.9'

services:
  # PostgreSQL - System of Record
  postgres:
    image: postgres:16-alpine
    container_name: akihlee-postgres
    environment:
      POSTGRES_DB: akihlee_dev
      POSTGRES_USER: akihlee
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akihlee"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: akihlee-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Pub/Sub emulator - local stand-in for GCP Pub/Sub. core-api (running
  # natively on the host, see below) points its Publisher at this via
  # PUBSUB_EMULATOR_HOST in its own .env. Pull-only — see pubsub-forwarder
  # for why push delivery to document-worker needs a shim locally.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: akihlee-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=akihlee-dev-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8085"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Forwards documents-received events from the emulator to document-worker
  # over HTTP, simulating Pub/Sub push delivery — see pubsub-forwarder/forwarder.py.
  # Never runs in production; real Pub/Sub pushes to document-worker directly.
  pubsub-forwarder:
    build:
      context: ./pubsub-forwarder
    container_name: akihlee-pubsub-forwarder
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: akihlee-dev-local
      PUSH_ENDPOINT: http://document-worker:8000/internal/pubsub/documents-received
    depends_on:
      pubsub-emulator:
        condition: service_healthy
      document-worker:
        condition: service_started
    restart: unless-stopped

  # MinIO - S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: akihlee-minio
    environment:
      MINIO_ROOT_USER: akihlee
      MINIO_ROOT_PASSWORD: dev_minio_password_min_8_chars
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Document Worker - OCR extraction (Python/FastAPI/Tesseract).
  # Runs in Docker rather than natively so Tesseract/poppler don't need to
  # be installed on the host (they're installed in the image's Dockerfile).
  document-worker:
    build:
      context: ../../apps/document-worker
    container_name: akihlee-document-worker
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: akihlee
      S3_SECRET_KEY: dev_minio_password_min_8_chars
      S3_BUCKET_DOCUMENTS: documents
      # core-api runs natively on the host, not in this compose network.
      CORE_API_URL: http://host.docker.internal:8080
      INTERNAL_API_KEY: dev_internal_worker_key_change_in_production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: akihlee-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set akihlee http://minio:9000 akihlee dev_minio_password_min_8_chars;
      mc mb --ignore-existing akihlee/documents;
      mc mb --ignore-existing akihlee/exports;
      mc anonymous set download akihlee/exports;
      echo 'MinIO buckets initialized';
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    name: akihlee-network
